name: CI

defaults:
  run: {shell: bash}

on:
  push: {branches: [main, feature.*]}
  pull_request:

permissions: {}

jobs:
  unit_tests:
    name: "Unit tests | ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 'lts/*'}
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with: {sdk: stable}
      - run: npm install
      - run: npm test

  static_analysis_code:
    name: "Static analysis"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 'lts/*'}
      - run: npm install
      - run: npm run lint

  static_analysis_ci:
    name: Static analysis (GitHub Actions)
    runs-on: ubuntu-latest

    permissions:
      security-events: write # Required by upload-sarif
      actions: read # Required by upload-sarif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with: {persona: pedantic}

  lint_spec:
    name: "Lint spec files"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 'lts/*'}
      - run: npm install
      - run: npm run lint-spec

  dart_sass_language:
    name: "Language | Dart Sass | Dart ${{ matrix.dart_channel }} | ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    if: "github.event_name != 'pull_request' || !contains(github.event.pull_request.body, 'skip dart-sass')"

    strategy:
      matrix:
        # We expect language test results not to vary from OS to OS. In most
        # cases, this is trivial, but for operations on very high-precision
        # floating-point numbers there are cases where float rounding can differ
        # (see sass/sass-spec#2156). To ensure we don't include these in our
        # test cases, we test against Windows and MacOS as well.
        os: [ubuntu-latest, windows-latest, macos-latest]
        dart_channel: [stable]
        include:
        - os: ubuntu-latest
          dart_channel: dev

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 'lts/*'}
      - run: npm install

      - uses: ./.github/util/dart-sass
        with:
          github-token: ${{ github.token }}
          dart-sdk: ${{ matrix.dart_channel }}

      - name: Run specs
        run: npm run sass-spec -- --dart dart-sass

  js_api_dart_sass:
    name: "JS API | Pure JS | Node ${{ matrix.node_version }} | ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    if: "github.event_name != 'pull_request' || !contains(github.event.pull_request.body, 'skip dart-sass')"

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node_version: ['lts/*']
        # Only test LTS versions on Ubuntu
        include:
        - os: ubuntu-latest
          node_version: lts/-1
        - os: ubuntu-latest
          node_version: lts/-2
        - os: ubuntu-latest
          node_version: lts/-3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: "${{ matrix.node_version }}"}
      - run: npm install

      - uses: ./.github/util/dart-sass
        with:
          github-token: ${{ github.token }}

      - name: Dart Sass | Build
        run: dart run grinder pkg-npm-dev
        env: {UPDATE_SASS_SASS_REPO: false}
        working-directory: dart-sass

      - name: Run specs
        run: |
          npm run js-api-spec -- \
            --sassPackage dart-sass/build/npm \
            --sassSassRepo dart-sass/build/language

  js_api_dart_sass_browser:
    name: "JS API | Pure JS | Browser"
    runs-on: ubuntu-latest
    if: "github.event_name != 'pull_request' || !contains(github.event.pull_request.body, 'skip dart-sass')"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      - run: npm install

      - uses: ./.github/util/dart-sass
        with:
          github-token: ${{ github.token }}

      - name: Dart Sass | Build
        run: dart run grinder pkg-npm-dev
        env: {UPDATE_SASS_SASS_REPO: false}
        working-directory: dart-sass

      - name: Run specs
        run: |
          npm run js-api-spec -- \
            --browser \
            --sassPackage dart-sass/build/npm \
            --sassSassRepo dart-sass/build/language
        env: {CHROME_EXECUTABLE: chrome}

  js_api_sass_embedded:
    name: "JS API | Embedded | Node ${{ matrix.node_version }} | ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.body, 'skip sass-embedded')

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node_version: ['lts/*']
        # Only test LTS versions on Ubuntu
        include:
        - os: ubuntu-latest
          node_version: lts/-1
        - os: ubuntu-latest
          node_version: lts/-2
        - os: ubuntu-latest
          node_version: lts/-3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: "${{ matrix.node_version }}"}
      - run: npm install

      - uses: ./.github/util/dart-sass
        with:
          github-token: ${{ github.token }}

      - name: Node.js Embedded Host | Checkout
        uses: sass/clone-linked-repo@ec2dcd11c5eaec56b64855712372056a14e9614d # v1.0.0
        with: {repo: sass/embedded-host-node, path: embedded-host-node}

      # Work around actions/checkout#197. We need this outside the main checkout
      # because otherwise its `node_modules` conflict with sass-spec's.
      - run: mv embedded-host-node ..

      - name: Node.js Embedded Host | Install
        run: |
          npm install
          npm run init -- \
            --compiler-path=../sass-spec/dart-sass \
            --language-path=../sass-spec/dart-sass/build/language
          npm run compile
        working-directory: ../embedded-host-node

      - name: Run specs
        run: |
          npm run js-api-spec -- \
            --sassPackage ../embedded-host-node \
            --sassSassRepo dart-sass/build/language
